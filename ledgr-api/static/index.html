<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEDGR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D10;--card:#14171B;--line:#22262B;--line2:#2C3137;--fg:#F2F4EF;--fg2:#C9CDD1;--mut:#9AA0A6;--ink:#0B0D10;--acc:#C8F560;color-scheme:dark}
html[data-theme=light]{--bg:#F5F6F1;--card:#FFFFFF;--line:#E3E5DD;--line2:#CDD0C6;--fg:#14171B;--fg2:#3A4046;--mut:#5F666D;--acc:#4D7C0F;color-scheme:light}
.crow{display:grid;grid-template-columns:46px 1fr 170px auto auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}.clr{padding:3px;width:46px}
@media(max-width:700px){.crow{grid-template-columns:46px 1fr}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif}
.app{display:flex;min-height:100vh}.rail{width:72px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
.ib{width:46px;height:46px;border-radius:16px;border:0;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s}.ib:hover{transform:translateY(-2px)}.ib.on{background:#C8F560;color:var(--ink)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.main{flex:1;min-width:0;max-width:1360px;padding:28px 36px;display:grid;gap:16px;align-content:start}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.hd h1{margin:4px 0 0;font-size:32px}
.t{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;animation:up .5s ease both}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.k{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}.n{font-size:34px;font-weight:700;margin-top:8px}.m{color:var(--mut);font-size:13px}
.btn,.chip{font-family:inherit;cursor:pointer;transition:transform .2s,background .2s}.btn{height:46px;padding:0 22px;border:0;border-radius:23px;background:#C8F560;color:var(--ink);font-weight:700;font-size:15px}.btn:hover{transform:translateY(-2px)}
.chip{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line2);background:none;color:var(--fg2);font-size:14px}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row b{margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px var(--line2)}.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.cs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);font-family:inherit;font-size:15px;width:100%}
form{display:grid;gap:10px}.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:6px}.inc{color:var(--acc)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:20px;font-weight:700;display:none}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth .t{width:100%;max-width:400px;padding:32px}
@media(max-width:700px){.app{flex-direction:column}.rail{flex-direction:row;width:100%;height:auto;position:static;border:0;padding:10px;justify-content:center}.logo{margin:0}.main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=c=>(c/100).toLocaleString('en-US',{style:'currency',currency:cur}),pct=x=>Math.round(x*100)+'%';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},thisMonth=()=>today().slice(0,7);
const LS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let user=null,cats=[],flt='all',q='',mode='login',editId=null,cur=LS.get('cur')||'USD',theme=LS.get('theme')||'dark';document.documentElement.dataset.theme=theme;
const PAL=['#C8F560','var(--fg)','#8EA2FF','#4A5058','#FF9F7A'];
const NAV=[['','Overview','<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],
['transactions','Transactions','<path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/>'],
['reports','Reports','<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'],
['goals','Goals','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'],
['categories','Categories','<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>'],
['profile','Profile','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>']];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
async function api(p,o={}){const r=await fetch('/api/v1'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});
 if(r.status===401&&!p.startsWith('/auth/login')&&!p.startsWith('/auth/register')){user=null;render();throw new Error('Please sign in')}
 if(!r.ok){let d='Request failed';try{const j=await r.json();d=typeof j.detail==='string'?j.detail:j.detail.map(x=>x.msg).join(', ')}catch{}throw new Error(d)}
 return r.status===204?null:r.json()}
const H=(t,s,r='')=>`<div class="hd"><div><div class="k">${s}</div><h1>${t}</h1></div>${r}</div>`;
const rows=l=>l.map(x=>`<div class="row"><span class="dot" style="background:${esc(catColor(x.category_id))}"></span><div>${esc(x.note||catName(x.category_id))}<div class="m">${x.occurred_on} · ${esc(catName(x.category_id))}</div></div><b class="${x.type=='income'?'inc':''}">${x.type=='income'?'+':'−'}${fmt(x.amount_cents)}</b><button class="x" data-edit="${x.id}" aria-label="Edit">✎</button><button class="x" data-del="${x.id}" aria-label="Delete">×</button></div>`).join('')||'<div class="m">Nothing here yet.</div>';
const catName=id=>(cats.find(c=>c.id===id)||{}).name||'Uncategorized',catColor=id=>(cats.find(c=>c.id===id)||{}).color||'#4A5058';
function bars(cf){const mx=Math.max(1,...cf.flatMap(m=>[m.income_cents,m.expense_cents])),w=520/cf.length;
 return `<svg viewBox="0 0 520 160" style="width:100%;margin-top:14px" role="img" aria-label="Income and expenses by month">${cf.map((m,i)=>{const a=m.income_cents/mx*110,b=m.expense_cents/mx*110,x=i*w+w/2-24;
 return `<rect x="${x}" y="${130-a}" width="22" height="${a}" rx="6" fill="#C8F560"/><rect x="${x+26}" y="${130-b}" width="22" height="${b}" rx="6" fill="#4A5058"/><text x="${x}" y="150" style="fill:var(--mut)" font-size="12">${m.month.slice(5)}</text>`}).join('')}</svg>`}
function donut(bc){let off=0;const C=339.3;return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Spending by category" style="transform:rotate(-90deg)"><circle cx="70" cy="70" r="54" fill="none" style="stroke:var(--line)" stroke-width="20"/>${bc.map((c,i)=>{const d=c.share*C,s=`<circle cx="70" cy="70" r="54" fill="none" style="stroke:${esc(c.color||PAL[i%5])}" stroke-width="20" stroke-dasharray="${d} ${C}" stroke-dashoffset="${-off}"/>`;off+=d;return s}).join('')}</svg>`}
const legend=bc=>bc.map((c,i)=>`<div class="row"><span class="dot" style="background:${esc(c.color||PAL[i%5])}"></span>${esc(c.name)}<b>${pct(c.share)}</b></div>`).join('')||'<div class="m">No expenses this month.</div>';
const budgets=bc=>bc.filter(c=>c.budget_cents).map(c=>{const p=Math.min(c.total_cents/c.budget_cents,1);return `<div><div class="row" style="border:0;padding:0 0 6px">${esc(c.name)}<b>${fmt(c.total_cents)} / ${fmt(c.budget_cents)}</b></div><div style="height:10px;border-radius:5px;background:var(--line)"><div style="width:${p*100}%;height:10px;border-radius:5px;background:${p>=1?'#FF9F7A':'#C8F560'}"></div></div></div>`}).join('');
const tiles=s=>`<div class="g"><div class="t" style="background:#C8F560;border:0;color:var(--ink)"><div class="k" style="color:#2B3A00">Balance</div><div class="n" style="font-size:48px">${fmt(s.balance_cents)}</div><div>${s.net_cents<0?'−':'+'}${fmt(Math.abs(s.net_cents))} net in ${s.month}</div></div><div class="t"><div class="k">Income</div><div class="n">${fmt(s.income_cents)}</div></div><div class="t"><div class="k">Expenses</div><div class="n">${fmt(s.expense_cents)}</div><div class="m">${s.transaction_count} entries</div></div></div>`;
async function vOverview(){const[s,cf,bc,tx]=await Promise.all([api('/reports/summary'),api('/reports/cash-flow?months=6'),api('/reports/by-category'),api('/transactions?limit=5')]);
 return H('Overview',s.month,'<a class="btn" href="#/transactions" style="display:grid;place-items:center;text-decoration:none">+ Add entry</a>')+tiles(s)+`<div class="g"><div class="t"><div class="k">Cash flow · 6 months</div>${bars(cf)}</div><div class="t"><div class="k">Spending by category</div><div class="cs" style="gap:22px;margin-top:14px">${donut(bc)}<div style="flex:1;min-width:150px">${legend(bc)}</div></div></div></div><div class="t"><div class="k">Recent</div>${rows(tx.items)}</div>`}
async function vTx(){const qs=new URLSearchParams({limit:100});if(flt!='all')qs.set('type',flt);if(q)qs.set('q',q);const p=await api('/transactions?'+qs);
 const e=p.items.find(x=>x.id===editId);if(!e)editId=null;const sel=(a,b)=>a==b?' selected':'';
 return H('Transactions',p.total+' entries','<input id="q" placeholder="Search notes" aria-label="Search" value="'+esc(q)+'" style="width:220px">')+`<div class="cs">${['all','income','expense'].map(f=>`<button class="chip ${flt==f?'on':''}" data-f="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))"><div class="t">${rows(p.items)}</div><div class="t" style="align-self:start"><div class="k">${e?'Edit entry':'Quick add'}</div><form id="fTx" style="margin-top:14px"><select name="type" aria-label="Type"><option value="expense">Expense</option><option value="income"${sel(e&&e.type,'income')}>Income</option></select><input name="amount" type="number" step="0.01" min="0.01" required placeholder="Amount" aria-label="Amount" value="${e?(e.amount_cents/100).toFixed(2):''}"><select name="category_id" aria-label="Category"><option value="">Uncategorized</option>${cats.map(c=>`<option value="${c.id}"${sel(e&&e.category_id,c.id)}>${esc(c.name)}</option>`).join('')}</select><input name="occurred_on" type="date" required value="${e?e.occurred_on:today()}" aria-label="Date"><input name="note" maxlength="200" placeholder="Note" aria-label="Note" value="${e?esc(e.note):''}"><button class="btn">${e?'Save changes':'Save entry'}</button>${e?'<button type="button" class="chip" data-act="cancel">Cancel</button>':''}</form></div></div>`}
async function vCats(){const bc=await api('/reports/by-category'),sp=Object.fromEntries(bc.filter(c=>c.category_id).map(c=>[c.category_id,c.total_cents])),bud=c=>c.monthly_budget_cents!=null?(c.monthly_budget_cents/100).toFixed(2):'';
 return H('Categories','Organise spending and set monthly budgets')+`<div class="t"><div class="k">Your categories</div>${cats.map(c=>`<form class="crow" data-cid="${c.id}"><input type="color" name="color" class="clr" value="${esc(c.color||'#4a5058')}" aria-label="Colour"><div style="min-width:0"><input name="name" required maxlength="40" value="${esc(c.name)}" aria-label="Name"><div class="m" style="margin:4px 0 0 8px">This month: ${fmt(sp[c.id]||0)}</div></div><input name="budget" type="number" step="0.01" min="0" placeholder="Monthly budget" value="${bud(c)}" aria-label="Monthly budget"><button class="chip on">Save</button><button type="button" class="x" data-cdel="${c.id}" aria-label="Delete category">×</button></form>`).join('')}</div><div class="t"><div class="k">New category</div><form id="fCat" class="crow" style="margin-top:10px"><input type="color" name="color" class="clr" value="#c8f560" aria-label="Colour"><input name="name" required maxlength="40" placeholder="Name" aria-label="Name"><input name="budget" type="number" step="0.01" min="0" placeholder="Monthly budget (optional)" aria-label="Monthly budget"><button class="btn">Add</button></form></div>`}
async function vReports(){const m=vReports.m||thisMonth(),[s,bc,cf]=await Promise.all([api('/reports/summary?month='+m),api('/reports/by-category?month='+m),api('/reports/cash-flow?months=12')]);
 return H('Reports','Financial reports',`<div class="cs"><input id="mon" type="month" value="${m}" aria-label="Month" style="width:170px"><a class="btn" href="/api/v1/reports/export.csv?month=${m}" style="display:grid;place-items:center;text-decoration:none">Export</a></div>`)+tiles(s)+`<div class="g"><div class="t"><div class="k">Savings rate</div><div class="n">${s.savings_rate==null?'—':pct(s.savings_rate)}</div></div><div class="t"><div class="k">Top categories</div><div class="cs" style="gap:22px;margin-top:14px">${donut(bc)}<div style="flex:1;min-width:150px">${legend(bc)}</div></div></div></div><div class="t"><div class="k">Cash flow · 12 months</div>${bars(cf)}</div>${budgets(bc)?`<div class="t"><div class="k">Budgets</div><div style="display:grid;gap:16px;margin-top:16px">${budgets(bc)}</div></div>`:'<div class="t m">Set monthly budgets in Categories to track them here.</div>'}`}
const ring=p=>`<div style="position:relative;width:96px;height:96px;flex:none"><svg viewBox="0 0 140 140" width="96" height="96" role="img" aria-label="${pct(p)}" style="transform:rotate(-90deg)"><circle cx="70" cy="70" r="54" fill="none" style="stroke:var(--line)" stroke-width="16"/><circle cx="70" cy="70" r="54" fill="none" stroke="#C8F560" stroke-width="16" stroke-linecap="round" stroke-dasharray="${p*339.3} 339.3"/></svg><b style="position:absolute;inset:0;display:grid;place-items:center">${pct(p)}</b></div>`;
async function vGoals(){const gs=await api('/goals');
 return H('Goals','Save and stay on budget')+`<div class="g">${gs.map(g=>`<div class="t"><div class="cs" style="gap:18px;flex-wrap:nowrap">${ring(g.progress)}<div style="flex:1"><div style="font-size:20px;font-weight:700">${esc(g.name)}</div><div class="m">${fmt(g.saved_cents)} of ${fmt(g.target_cents)}${g.deadline?' · '+g.deadline:''}</div></div><button class="x" data-gdel="${g.id}" aria-label="Delete goal">×</button></div><form data-gid="${g.id}" style="grid-template-columns:1fr auto;margin-top:16px"><input name="amount" type="number" step="0.01" min="0.01" required placeholder="Add savings" aria-label="Amount to add"><button class="chip on">Add</button></form></div>`).join('')}<div class="t"><div class="k">New goal</div><form id="fGoal" style="margin-top:14px"><input name="name" required maxlength="60" placeholder="Goal name" aria-label="Goal name"><input name="target" type="number" step="0.01" min="1" required placeholder="Target amount" aria-label="Target"><input name="deadline" type="date" aria-label="Deadline"><button class="btn">Create goal</button></form></div></div>`}
async function vProfile(){return H('Profile','Account')+`<div class="g"><div class="t"><div class="row"><span>Email</span><b>${esc(user.email)}</b></div><div class="row"><span>Theme</span><select id="selTheme" aria-label="Theme" style="width:140px;margin-left:auto"><option value="dark"${theme=='dark'?' selected':''}>Dark</option><option value="light"${theme=='light'?' selected':''}>Light</option></select></div><div class="row"><span>Currency</span><select id="selCur" aria-label="Currency" style="width:140px;margin-left:auto">${['USD','EUR','GBP','KES'].map(c=>`<option${c==cur?' selected':''}>${c}</option>`).join('')}</select></div><div class="row"><span>Export my data</span><a class="m" href="/api/v1/reports/export.csv" style="margin-left:auto">CSV</a></div><button class="chip" data-act="out" style="width:100%;margin-top:18px">Sign out</button></div></div>`}
const VIEWS={'':vOverview,transactions:vTx,categories:vCats,reports:vReports,goals:vGoals,profile:vProfile};
function authView(){$('#root').innerHTML=`<div class="auth"><div class="t"><div class="logo" style="margin:0">L</div><h1 style="margin:22px 0 4px;font-size:30px">${mode=='login'?'Welcome back':'Create account'}</h1><div class="m">${mode=='login'?'Sign in to your ledger.':'Start tracking in a minute.'}</div><form id="fAuth" style="margin:24px 0 10px"><input name="email" type="email" required placeholder="Email" aria-label="Email" autocomplete="email"><input name="password" type="password" required minlength="8" placeholder="Password (8+ characters)" aria-label="Password" autocomplete="${mode=='login'?'current-password':'new-password'}"><button class="btn">${mode=='login'?'Sign in':'Create account'}</button></form><button class="chip" data-act="mode" style="width:100%">${mode=='login'?'Create account':'I already have an account'}</button></div></div>`}
async function render(){if(!user)return authView();const r=location.hash.replace(/^#\/?/,'');const v=VIEWS[r]||vOverview;let h;
 try{h=await v()}catch(e){if(!user)return;h=`<div class="t">${esc(e.message)}</div>`}
 $('#root').innerHTML=`<div class="app"><nav class="rail" aria-label="Main"><div class="logo">L</div>${NAV.map(([k,l,p])=>`<a class="ib ${(VIEWS[r]?r:'')==k?'on':''}" href="#/${k}" aria-label="${l}" title="${l}"><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg></a>`).join('')}</nav><main class="main">${h}</main></div>`}
const money=v=>Math.round(parseFloat(v)*100);
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 try{if(f.id=='fAuth'){const r=await api('/auth/'+(mode=='login'?'login':'register'),{method:'POST',body:{email:d.email,password:d.password}});user=r.user;cats=await api('/categories')}
 else if(f.id=='fTx'){const b={type:d.type,amount_cents:money(d.amount),occurred_on:d.occurred_on,category_id:d.category_id?+d.category_id:null,note:d.note};if(editId){await api('/transactions/'+editId,{method:'PATCH',body:b});editId=null}else await api('/transactions',{method:'POST',body:b})}
 else if(f.id=='fCat'){await api('/categories',{method:'POST',body:{name:d.name,color:d.color,monthly_budget_cents:d.budget===''?null:money(d.budget)}});cats=await api('/categories')}
 else if(f.dataset.cid){await api('/categories/'+f.dataset.cid,{method:'PATCH',body:{name:d.name,color:d.color,monthly_budget_cents:d.budget===''?null:money(d.budget)}});cats=await api('/categories');toast('Saved')}
 else if(f.id=='fGoal')await api('/goals',{method:'POST',body:{name:d.name,target_cents:money(d.target),deadline:d.deadline||null}});
 else if(f.dataset.gid)await api('/goals/'+f.dataset.gid+'/contribute',{method:'POST',body:{amount_cents:money(d.amount)}});
 render()}catch(err){toast(err.message)}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act],[data-f],[data-del],[data-gdel],[data-edit],[data-cdel]');if(!t)return;
 try{if(t.dataset.f){flt=t.dataset.f;render()}
 else if(t.dataset.edit){editId=+t.dataset.edit;if(location.hash!='#/transactions')location.hash='#/transactions';else render()}
 else if(t.dataset.del){await api('/transactions/'+t.dataset.del,{method:'DELETE'});if(editId==t.dataset.del)editId=null;render()}
 else if(t.dataset.cdel){if(confirm('Delete this category? Its transactions will become Uncategorized.')){await api('/categories/'+t.dataset.cdel,{method:'DELETE'});cats=await api('/categories')}render()}
 else if(t.dataset.gdel){await api('/goals/'+t.dataset.gdel,{method:'DELETE'});render()}
 else if(t.dataset.act=='cancel'){editId=null;render()}
 else if(t.dataset.act=='mode'){mode=mode=='login'?'register':'login';render()}
 else if(t.dataset.act=='out'){await api('/auth/logout',{method:'POST'});user=null;render()}}catch(err){toast(err.message)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){clearTimeout(window._qh);window._qh=setTimeout(async()=>{q=e.target.value;await render();const el=$('#q');if(el){el.focus();el.setSelectionRange(q.length,q.length)}},300)}});
document.addEventListener('change',e=>{const i=e.target.id;if(i=='mon'&&e.target.value){vReports.m=e.target.value;render()}else if(i=='selTheme'){theme=e.target.value;LS.set('theme',theme);document.documentElement.dataset.theme=theme}else if(i=='selCur'){cur=e.target.value;LS.set('cur',cur);toast('Currency set to '+cur)}});
addEventListener('hashchange',render);
api('/auth/me').then(u=>user=u).then(()=>api('/categories')).then(c=>cats=c).catch(()=>{}).finally(render);
</script></body></html>
